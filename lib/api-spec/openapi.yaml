                $ref: "#/components/schemas/AccessRequest"

  /access-request:
    post:
      operationId: submitAccessRequest
      tags: [roster]
      summary: Submit an access request (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAccessRequestBody"
      responses:
        "201":
          description: Access request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequest"

  # Object storage
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /storage/uploads/metadata:
    get:
      operationId: getUploadedFileMetadata
      tags: [storage]
      summary: Get original filename / mime type / size for an uploaded object
      parameters:
        - name: path
          in: query
          required: true
          description: Storage object path (e.g. "/objects/<id>")
          schema:
            type: string
      responses:
        "200":
          description: Uploaded file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFileMetadata"
        "404":
          description: No metadata recorded for this object

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Get a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object file content

  # Campus Insights (hidden admin-only page) — server-side aggregates.
  /admin/campus-insights:
    get:
      operationId: getCampusInsightsOverview
      tags: [admin]
      summary: Per-campus aggregate metrics (admin only)
      responses:
        "200":
          description: Campus-level aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusInsightsOverviewResponse"

  /admin/campus-insights/{campusId}:
    get:
      operationId: getCampusInsightsByCampus
      tags: [admin]
      summary: Per-team aggregate metrics for one campus (admin only)
      parameters:
        - name: campusId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team-level aggregates for the campus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusInsightsCampusResponse"

  /brd-analysis/all:
    get:
      operationId: listBrdAnalyses
      tags: [brd-analysis]
      summary: List the latest AI BRD analysis snapshot for every analysed revenue entry (admin only).
      responses:
        "200":
          description: All analysed entries, most-recent analysis first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrdAnalysisListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Admin role required

  /brd-analysis/history/{entryId}:
    get:
      operationId: getBrdAnalysisHistory
      tags: [brd-analysis]
      summary: Get the full append-only AI analysis history for a revenue entry (admin only).
      parameters:
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry header + ordered list of past analyses (recent first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrdAnalysisHistoryResponse"
        "400":
          description: Invalid entry id
        "401":
          description: Unauthorized
        "403":
          description: Admin role required
        "404":
          description: Entry not found

