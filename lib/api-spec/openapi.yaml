      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueEntry"
        "409":
          description: Only verified entries can be revoked.

