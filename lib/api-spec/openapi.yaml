    post:
      operationId: verifyRevenueEntry
      tags: [financials]
      summary: Verify a revenue entry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEntryBody"
      responses:
        "200":
          description: Entry verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueEntry"

