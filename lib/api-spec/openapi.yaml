openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BRAVE Program Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: campuses
    description: Campus management
  - name: teams
    description: Team registration and management
  - name: projects
    description: Project management
  - name: financials
    description: Order book and revenue entries
  - name: leaderboard
    description: Leaderboard views
  - name: milestones
    description: Team milestones
  - name: demoday
    description: Demo day applications
  - name: notifications
    description: In-app notifications
  - name: announcements
    description: Programme announcements
  - name: admin
    description: Admin-only operations
  - name: storage
    description: Object storage
  - name: roster
    description: Student roster management
  - name: feedback
    description: Platform feedback submissions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth endpoints
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current auth user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"

  /auth/me:
    patch:
      operationId: updateCurrentAuthUser
      tags: [auth]
      summary: Update the signed-in user's editable profile fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuthMeBody"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"
        "409":
          description: Email or NIAT ID already in use by another account.

  # Campuses
  /campuses:
    get:
      operationId: listCampuses
      tags: [campuses]
      summary: List all campuses
      responses:
        "200":
          description: List of campuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campus"
    post:
      operationId: createCampus
      tags: [campuses]
      summary: Create a campus (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampusBody"
      responses:
        "201":
          description: Created campus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campus"

  /campuses/{id}:
    get:
      operationId: getCampus
      tags: [campuses]
      summary: Get a campus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campus details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campus"
    patch:
      operationId: updateCampus
      tags: [campuses]
      summary: Update a campus (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampusBody"
      responses:
        "200":
          description: Updated campus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campus"
    delete:
      operationId: deleteCampus
      tags: [campuses]
      summary: Delete a campus (admin only). Blocked when teams still belong to the campus.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Campus deleted
        "409":
          description: Campus still has teams and cannot be deleted

  # Teams
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams (filtered by role)
      parameters:
        - name: campusId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, rejected]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
        - name: sortBy
          in: query
          description: Column to sort by (global, across all pages). Omit to keep default creation order.
          schema:
            type: string
            enum:
              [
                name,
                campus,
                status,
                verifiedRevenue,
                pendingRevenue,
                rejectedRevenue,
                members,
                projects,
                updated,
                created,
              ]
        - name: sortDir
          in: query
          description: Sort direction. Defaults to asc when sortBy is provided.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: List of teams (paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTeamsResponse"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create/register a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamBody"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/my:
    get:
      operationId: getMyTeam
      tags: [teams]
      summary: Get current user's team
      responses:
        "200":
          description: User's team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamBody"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (leader or admin). Blocked when the team has any submitted or verified revenue or order-book entries. On success, cascades to members, projects, draft entries, milestones, demo-day applications, invitations, and join/leave requests.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Team deleted
        "403":
          description: Caller is not the team leader or an admin
        "404":
          description: Team not found
        "409":
          description: Team has submitted or verified financial entries and cannot be deleted

  /teams/{id}/reject:
    post:
      operationId: rejectTeam
      tags: [teams]
      summary: Reject a team registration (coordinator/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTeamBody"
      responses:
        "200":
          description: Team rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}/request-changes:
    post:
      operationId: requestTeamChanges
      tags: [teams]
      summary: Request changes to a team registration (coordinator/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestTeamChangesBody"
      responses:
        "200":
          description: Changes requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}/members:
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a member to a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTeamMemberBody"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"

  /teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a member from a team (admin or current team leader)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"

  /teams/{id}/transfer-leadership:
    post:
      operationId: transferTeamLeadership
      tags: [teams]
      summary: Transfer team leadership to another current member (current leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferTeamLeadershipBody"
      responses:
        "200":
          description: Leadership transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"

  /teams/browse:
    get:
      operationId: browseCampusTeams
      tags: [teams]
      summary: List teams at the current student's campus (any status)
      responses:
        "200":
          description: List of teams at user's campus
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"

  /teams/students/search:
    get:
      operationId: searchCampusStudents
      tags: [teams]
      summary: Search students at the current user's campus who aren't on a team
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: campusId
          in: query
          required: false
          description: Override campus to search in (admin only). Ignored for non-admins.
          schema:
            type: integer
      responses:
        "200":
          description: Matching students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampusStudent"

  /teams/join-by-code:
    post:
      operationId: joinTeamByCode
      tags: [teams]
      summary: Join a team using its invite code (campus-scoped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinByCodeBody"
      responses:
        "200":
          description: Joined team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"

  /teams/{id}/invitations:
    get:
      operationId: listTeamInvitations
      tags: [teams]
      summary: List invitations sent for a team (any member)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamInvitation"
    post:
      operationId: sendTeamInvitation
      tags: [teams]
      summary: Send an invitation to a student (any member)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInvitationBody"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamInvitation"

  /invitations/my:
    get:
      operationId: listMyInvitations
      tags: [teams]
      summary: List the current user's pending invitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamInvitation"

  /invitations/{id}/accept:
    post:
      operationId: acceptInvitation
      tags: [teams]
      summary: Accept a pending invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Joined team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"

  /invitations/{id}/decline:
    post:
      operationId: declineInvitation
      tags: [teams]
      summary: Decline a pending invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /invitations/{id}/cancel:
    post:
      operationId: cancelInvitation
      tags: [teams]
      summary: Cancel a pending invitation sent by the requester's team (any member). The invited student is not notified.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /teams/{id}/join-requests:
    get:
      operationId: listTeamJoinRequests
      tags: [teams]
      summary: List pending join requests for a team (any member)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamJoinRequest"
    post:
      operationId: requestToJoinTeam
      tags: [teams]
      summary: Request to join a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestToJoinBody"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamJoinRequest"

  /join-requests/{id}/approve:
    post:
      operationId: approveJoinRequest
      tags: [teams]
      summary: Approve a pending join request (any team member)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDetail"

  /join-requests/{id}/decline:
    post:
      operationId: declineJoinRequest
      tags: [teams]
      summary: Decline a pending join request (any team member)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /teams/{id}/leave-requests:
    get:
      operationId: listTeamLeaveRequests
      tags: [teams]
      summary: List pending leave requests (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamLeaveRequest"
    post:
      operationId: requestToLeaveTeam
      tags: [teams]
      summary: Request to leave a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestToLeaveBody"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamLeaveRequest"

  /leave-requests/{id}/approve:
    post:
      operationId: approveLeaveRequest
      tags: [teams]
      summary: Approve a pending leave request (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /leave-requests/{id}/decline:
    post:
      operationId: declineLeaveRequest
      tags: [teams]
      summary: Decline a pending leave request (leader only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Projects
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects (paginated). Students see only their own team; coordinators see only their campus; admins see all.
      parameters:
        - name: teamId
          in: query
          schema:
            type: integer
        - name: campusId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
        - name: sortBy
          in: query
          description: Column to sort by (global, across all pages). Omit to keep default creation order.
          schema:
            type: string
            enum: [title, team, status, revenueStatus, revenue, orderBook, updated, created]
        - name: sortDir
          in: query
          description: Sort direction. Defaults to asc when sortBy is provided.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project with financials
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (team member or admin/coordinator). Blocked when submitted/verified entries exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Caller is not a team member or staff
        "404":
          description: Project not found
        "409":
          description: Project has submitted or verified financial entries

  # Order Book Entries
  /order-book-entries:
    get:
      operationId: listOrderBookEntries
      tags: [financials]
      summary: List order book entries
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [verified]
      responses:
        "200":
          description: List of order book entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderBookEntry"
    post:
      operationId: createOrderBookEntry
      tags: [financials]
      summary: Create an order book entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBookEntryBody"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBookEntry"

  /order-book-entries/{id}:
    get:
      operationId: getOrderBookEntry
      tags: [financials]
      summary: Get an order book entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order book entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBookEntry"
    patch:
      operationId: updateOrderBookEntry
      tags: [financials]
      summary: Update an order book entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderBookEntryBody"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBookEntry"
    delete:
      operationId: deleteOrderBookEntry
      tags: [financials]
      summary: Delete an order book entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Revenue Entries
  /revenue-entries:
    get:
      operationId: listRevenueEntries
      tags: [financials]
      summary: List revenue entries
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, verified, revoked, rejected]
      responses:
        "200":
          description: List of revenue entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueEntry"
    post:
      operationId: createRevenueEntry
      tags: [financials]
      summary: Create a revenue entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRevenueEntryBody"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueEntry"

  /revenue-entries/{id}:
    get:
      operationId: getRevenueEntry
      tags: [financials]
      summary: Get a revenue entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revenue entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueEntry"
    patch:
      operationId: updateRevenueEntry
      tags: [financials]
      summary: Update a revenue entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRevenueEntryBody"
