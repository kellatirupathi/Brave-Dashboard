  /admin/roster/clear:
    post:
      operationId: clearAllRoster
      tags: [roster]
      summary: Permanently delete every roster entry (admin only)
      description: |
        Wipes the entire roster table in a single transaction. Linked user
        accounts, teams, projects and progress are intentionally NOT
        deleted — affected students simply lose campus eligibility until
        re-added. Caller must send the literal confirmation phrase
        `DELETE ALL ROSTER` in the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
                  description: Must equal "DELETE ALL ROSTER".
              required: [confirm]
      responses:
        "200":
          description: Roster cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: integer
                    description: Number of roster rows that were removed.
                required: [ok, deleted]

