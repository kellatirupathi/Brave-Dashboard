      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectEntryBody"
      responses:
        "200":
          description: Entry rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueEntry"

  /revenue-entries/{id}/reanalyse:
    post:
      operationId: reanalyseRevenueEntry
      tags: [financials]
      summary: Re-run the AI BRD auditor on a revenue entry (admin only). Runs immediately; bypasses the 5-minute submission delay.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis complete (or scheduled). Returns the updated revenue entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueEntry"
        "400":
          description: Entry has no BRD attached.
        "404":
          description: Entry not found.

  /revenue-entries/{id}/unverify:
    post:
      operationId: unverifyRevenueEntry
      tags: [financials]
      summary: Move a verified revenue entry back to the review queue (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry unverified and moved back to submitted status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueEntry"
        "403":
          description: Forbidden — admin role required
        "404":
          description: Entry not found
        "409":
          description: Only verified entries can be unverified

